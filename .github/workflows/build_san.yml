name: Build San executables

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: san-windows
            exe_path: san/dist/san.exe
            release_name: san-${{ github.ref_name }}-windows.exe
          - os: macos-latest
            artifact_name: san-macos
            exe_path: san/dist/san
            release_name: san-${{ github.ref_name }}-macos
          - os: ubuntu-latest
            artifact_name: san-linux
            exe_path: san/dist/san
            release_name: san-${{ github.ref_name }}-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: san
        run: |
          pyinstaller --onefile --name san ^
            --add-data "san-code;sancode" ^
            --add-data "src;src" ^
            --add-data "tests;tests" ^
            --add-data "docs;docs" ^
            --add-data "logo.png;." ^
            main.py

      - name: Build executable (macOS / Linux)
        if: matrix.os != 'windows-latest'
        working-directory: san
        run: |
          pyinstaller --onefile --name san \
            --add-data "san-code:sancode" \
            --add-data "src:src" \
            --add-data "tests:tests" \
            --add-data "docs:docs" \
            --add-data "logo.png:." \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.exe_path }}

  create_release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: san-windows
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: san-macos
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: san-linux
          path: artifacts

      - name: Rename artifacts
        run: |
          cd artifacts
          mv san.exe "san-${{ github.ref_name }}-windows.exe"
          mv san     "san-${{ github.ref_name }}-macos"
          mv san     "san-${{ github.ref_name }}-linux"

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: San ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/san-${{ github.ref_name }}-windows.exe
            artifacts/san-${{ github.ref_name }}-macos
            artifacts/san-${{ github.ref_name }}-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

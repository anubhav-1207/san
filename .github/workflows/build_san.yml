name: Build San executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: san-windows
            output: dist/san.exe

          - os: macos-latest
            artifact: san-macos
            output: dist/san

          - os: ubuntu-latest
            artifact: san-linux
            output: dist/san

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
        shell: bash

      - name: Build executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm `
            --onefile `
            --name san `
            --add-data "tests;tests" `
            --add-data "docs;docs" `
            --add-data "logo.png;." `
            main.py

      - name: Build executable on macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller --clean --noconfirm \
            --onefile \
            --name san \
            --add-data "tests:tests" \
            --add-data "docs:docs" \
            --add-data "logo.png:." \
            main.py

      - name: Show generated files
        shell: bash
        run: |
          ls -lah dist

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
